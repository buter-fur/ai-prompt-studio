name: 构建

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Windows runner 默认走 ANSI 代码页，脚本里的中文输出会炸，全局强制 UTF-8
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  # ---------------------------------------------------------------- 测试
  test:
    name: 前端自测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 跑断言
        run: node tools/boot_test.js

  # ---------------------------------------------------------------- macOS
  macos:
    name: macOS App
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 Pillow（生成图标用）
        run: python3 -m pip install --upgrade pillow
      - name: 打包
        run: python3 tools/build.py
      - name: 压缩 .app
        run: |
          cd build/dist
          zip -r -y "../../AI提示词工作台-macOS.zip" "AI提示词工作台.app"
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: prompt-studio-macos
          path: AI提示词工作台-macOS.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 Pillow（生成图标用）
        run: python -m pip install --upgrade pillow
      - name: 打包
        id: pkg
        shell: pwsh
        run: |
          python tools/build.py 2>&1 | Tee-Object -FilePath build-win.log
          exit $LASTEXITCODE
      - name: 失败时把日志推到 ci-log 分支（便于排查）
        if: failure()
        shell: bash
        run: |
          set -x
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-log
          mkdir -p ci-log
          cp build-win.log ci-log/windows.txt 2>/dev/null || echo "(没有 build-win.log)" > ci-log/windows.txt
          { echo "=== python ==="; python -V;
            echo "=== platform ==="; python -c "import platform,sys;print(platform.platform(), sys.version)";
            echo "=== 已装包 ==="; python -m pip list;
            echo "=== build 目录 ==="; ls -la build/ 2>/dev/null || echo "(无)";
            echo "=== pylibs ==="; ls build/pylibs 2>/dev/null | head -30 || echo "(无)";
          } > ci-log/env.txt 2>&1
          git add -f ci-log
          git commit -m "windows build log [skip ci]"
          git push -f origin ci-log
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: prompt-studio-windows
          path: build/dist/*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- Release
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 整理文件
        run: |
          mkdir -p out
          cp artifacts/prompt-studio-macos/*.zip out/ 2>/dev/null || true
          cp artifacts/prompt-studio-windows/*.zip out/ 2>/dev/null || true
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
